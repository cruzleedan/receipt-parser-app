services:
  parser:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: receipt-parser-app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - rag-network
    ports:
      - "8002:8000"
    volumes:
      - ./receipts:/app/receipts:ro
      - ./output:/app/output
    env_file:
      - .env
    environment:
      # WORK-0008: one local vision model reads the receipt; PaddleOCR + llama3.2 is the fallback.
      # No images go to Gemini (WORK-0003); GEMINI_* in .env is no longer used by this backend.
      - PARSER_BACKEND=vlm_ollama
      - VLM_HOST=http://parser-ollama:11434
      - VLM_MODEL=${VLM_MODEL:-qwen3.5:4b}
      - VLM_KEEP_ALIVE=-1
      - OLLAMA_HOST=http://shared-ollama:11434
      - OLLAMA_MODEL=llama3.2-gpu:latest
      - OLLAMA_TIMEOUT=120
      - OLLAMA_NUM_PREDICT=1024
      - OLLAMA_TOP_P=0.8
      - OCR_USE_GPU=false
      - OCR_LANG=en
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - FLAGS_use_mkldnn=false
      - FLAGS_use_onednn=false
      - FLAGS_enable_pir_api=false
      - CPU_NUM=4
      - PYTHONUNBUFFERED=1
    depends_on:
      - parser-ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          memory: 2G
    restart: unless-stopped
    # WORK-0002 / expense-api WORK-0057: bounded logs (about 50 MB).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # WORK-0008: the parser's own Ollama on the Radeon 890M through Vulkan, separate from
  # shared-ollama (ROCm image, used by RAG and flutter-rag). Not published; only the parser reaches it.
  # After a fresh volume: docker exec parser-ollama ollama pull qwen3.5:4b
  parser-ollama:
    image: ollama/ollama:0.40.12
    container_name: parser-ollama
    networks:
      - default
    devices:
      - /dev/dri:/dev/dri
    # d3's render and video group ids (getent group render video); the container has no such names.
    group_add:
      - "993"
      - "44"
    environment:
      - OLLAMA_VULKAN=1
      - OLLAMA_IGPU_ENABLE=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - parser-ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  parser-ollama-models:

networks:
  rag-network:
    external: true
    name: shared-ollama-network